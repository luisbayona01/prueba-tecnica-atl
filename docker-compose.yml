services:
  db:
    image: mysql:8.0
    container_name: prueba_contactos_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: prueba_contactos
      MYSQL_USER: contactos
      MYSQL_PASSWORD: contactos123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # El esquema se aplica automaticamente en el primer arranque del contenedor.
      - ./backend/database/database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: prueba_contactos_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: prueba_contactos
      DB_USERNAME: contactos
      DB_PASSWORD: contactos123
      APP_ENV: production
      APP_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8089:80"

  frontend:
    build: ./frontend
    container_name: prueba_contactos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4400:80"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: prueba_contactos_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_USER: contactos
      PMA_PASSWORD: contactos123
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  db_data: